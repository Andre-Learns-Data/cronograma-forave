<!-- Metas de PWA (instalação + ecrã inteiro no telemóvel). Incluído no <head>
     de todas as páginas para o comportamento ser consistente onde quer que o
     utilizador chegue: o botão "Instalar" (Android/Chrome) precisa do manifesto
     na página; o iPhone usa o apple-touch-icon e o apple-mobile-web-app-capable
     para instalar com o ícone certo e correr em ecrã inteiro (não dentro do Safari). -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#196141">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cronograma">
